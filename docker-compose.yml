services:
  backend:
    build: .
    env_file:
      - .env

    ports:
      - "8000:8000"
      
    command: 
      sh -c "python manage.py wait_for_db &&
            python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"

    volumes:
      - .:/app

    depends_on:
      - db

  db:
    image: mysql:9.7

    restart: always

    env_file: .env

    ports:
      - "3306:3306"

    volumes:
      - backend_db:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d

volumes:
  backend_db: